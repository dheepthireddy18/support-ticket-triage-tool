[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ticket-triage-tool"
version = "0.1.0"
description = "Command-line tool that prioritizes support tickets and generates a daily summary report."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "python-dotenv>=1"]
llm = ["anthropic>=1", "python-dotenv>=1", "truststore>=0.9"]  # optional LLM and Jev rules
pdf = ["reportlab>=4"]
email = ["python-dotenv>=1", "truststore>=0.9"]  # settings from .env; OS certificates for TLS

[project.scripts]
ticket-triage = "ticket_triage.ticket_triage_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
